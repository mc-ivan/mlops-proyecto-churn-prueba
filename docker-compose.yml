version: "3.9"

services:
  api:
    build:
      context: .
    container_name: churn-api-mamani

    ports:
      - "8005:8000"

    volumes:
      - .:/app

    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest

    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    restart: unless-stopped

    depends_on:
      - api
